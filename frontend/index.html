<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE ICC — Interstellar Cultural Council</title>

    <!--
      Typography — four faces, each with a clear role:
        Cormorant Garamond  display headings, card-spine titles
        Spectral            serif body for cards/modals (JSTOR/article register)
        IBM Plex Sans       UI controls, buttons, form labels
        JetBrains Mono      numerals, citations, sequence numbers, tags
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Set the deep space ground early to prevent flash of white -->
    <style>
      html, body, #root { height: 100%; background: #03060d; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
