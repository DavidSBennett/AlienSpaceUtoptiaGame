name: Build & Deploy to GreenGeeks

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # lets you trigger a deploy manually from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assemble publish/ (built app + PHP)
        run: |
          mkdir -p publish
          cp -r frontend/dist/. publish/
          cp backend/*.php publish/
          # config.secret.php, dbConfig.php, vendor/, uploads/, Images/ are
          # intentionally NOT here — they live only on the server.

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./publish/
          server-dir: public_html/thehistorians.org/
          # Belt-and-suspenders: never touch server-only files even if present.
          exclude: |
            **/config.secret.php
            **/dbConfig.php
            **/vendor/**
            **/uploads/**
            **/Images/**
