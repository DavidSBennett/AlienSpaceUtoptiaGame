name: Build & Deploy to GreenGeeks (SSH)

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # lets you trigger a deploy manually from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assemble publish/ (built app + PHP)
        run: |
          mkdir -p publish
          cp -r frontend/dist/. publish/
          cp backend/*.php publish/
          # config.secret.php, dbConfig.php, vendor/, uploads/, Images/ are
          # intentionally NOT here — they live only on the server.

      - name: Deploy via SSH (rsync)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST:     ${{ secrets.SSH_HOST }}
          REMOTE_USER:     ${{ secrets.SSH_USERNAME }}
          REMOTE_PORT:     ${{ secrets.SSH_PORT }}
          SOURCE: "publish/"
          # Playtest install: alienspace.thehistorians.org (temporary name).
          # Adjust if cPanel put the subdomain docroot somewhere else.
          TARGET: "public_html/alienspace.thehistorians.org/"
          # rsync flags: NO --delete, so server-only files are never removed.
          ARGS: "-rltgoDzvO --no-perms"
          EXCLUDE: "config.secret.php, dbConfig.php, vendor/, uploads/, Images/"
          # After upload, flush PHP OPcache so the new .php files run immediately
          # (LiteSpeed serves static assets fresh but can keep stale PHP bytecode).
          SCRIPT_AFTER: |
            curl -s "https://alienspace.thehistorians.org/_opcache_reset.php?token=bf5d5bf1de8bcbc0c7ceae99c868ca8f" >/dev/null 2>&1 || true
